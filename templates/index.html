<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>PriceRadar</title><style>*{box-sizing:border-box}body{margin:0;background:#f5f6fa;color:#182238;font:16px system-ui}header{background:white;padding:22px max(5%,calc((100% - 1000px)/2));font-size:24px;font-weight:800}span{color:#6454e8}main{max-width:1000px;margin:auto;padding:60px 20px}h1{font-size:clamp(36px,6vw,64px);letter-spacing:-2px;line-height:1.1;margin:16px 0}p{color:#647084;line-height:1.6}.hero{text-align:center}form{display:flex;gap:10px;background:white;padding:12px;border-radius:16px;margin:30px auto;max-width:760px;box-shadow:0 8px 30px #18223810}input{flex:1;min-width:0;padding:15px;border:1px solid #dce0e9;border-radius:8px;font:inherit}button{background:#6454e8;color:white;border:0;padding:15px 22px;border-radius:8px;font:inherit;font-weight:700;cursor:pointer}button:disabled{opacity:.6}.offer{background:white;border:1px solid #e2e5ee;border-radius:14px;padding:20px;margin:12px 0;display:flex;justify-content:space-between;gap:20px;align-items:center}.price{font-size:24px;font-weight:800;white-space:nowrap}.small{font-size:13px;color:#647084}a{color:#6454e8}label{display:block;font-size:13px;color:#647084}#status{padding:12px;text-align:center} @media(max-width:600px){form{flex-direction:column}.offer{align-items:flex-start;flex-direction:column}main{padding-top:35px}}</style><header>Price<span>Radar.</span></header><main><section class="hero"><label>SMART SHOPPING STARTS HERE</label><h1>Same product.<br><span>Better price.</span></h1><p>Compare shopping offers across available Indian retailers.</p><form id="search"><input id="query" aria-label="Product link or name" placeholder="Paste a product link or enter exact model" required><button>Compare prices</button></form><p class="small">Live shopping search · INR · Verify exact variant and delivery before buying</p></section><div id="status" role="status"></div><section id="results"></section></main><script>const form=document.querySelector('form'),status=document.querySelector('#status'),results=document.querySelector('#results');function add(parent,tag,value,cls){const e=document.createElement(tag);e.textContent=value;if(cls)e.className=cls;parent.append(e);return e}form.onsubmit=async e=>{e.preventDefault();results.replaceChildren();status.textContent='Searching available shopping offers…';const button=form.querySelector('button');button.disabled=true;try{const r=await fetch('/api/compare',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({query:document.querySelector('#query').value})});const d=await r.json();if(!r.ok)throw Error(d.error);status.textContent=d.offers.length?`${d.offers.length} offers found. Confirm exact model, condition and variant before comparing.`:'No INR offers found.';d.offers.forEach((o,i)=>{const card=add(results,'article','','offer');const info=add(card,'div','');if(i===0)add(info,'label','LOWEST LISTED PRICE — MATCH NOT VERIFIED');add(info,'h3',o.title);add(info,'p',o.store+' · Delivery: '+o.delivery,'small');const right=add(card,'div','');add(right,'div',o.price.toLocaleString('en-IN',{style:'currency',currency:'INR'}),'price');if(o.link){const a=add(right,'a','View offer ↗');a.href=o.link;a.target='_blank';a.rel='noopener noreferrer'}})}catch(err){status.textContent=err.message}finally{button.disabled=false}};</script></html>
